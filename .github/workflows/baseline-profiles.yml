name: 🚀 Baseline Profiles

on:
  workflow_dispatch:
  schedule:
    # Every Friday at 04:42 UTC. Off-peak to avoid clashing with the icon and release jobs.
    - cron: '42 4 * * 5'

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  baseline-profiles:
    name: 🚀 Generate Baseline Profiles
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_SPARK || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # Hardware acceleration for the Gradle Managed Device emulator.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: ./.github/actions/setup-gradle-properties

      # Baseline profiles capture code paths, not timings, so the pixel6Api33 GMD emulator is valid.
      # swiftshader_indirect is required: GitHub runners have no host GPU.
      - name: 📥 Fetch baseline profiles from LFS
        run: git lfs pull --include="**/generated/baselineProfiles/*.txt"
      - name: 🚀 Generate Baseline Profiles
        run: >-
          ./gradlew :spark:generateBaselineProfile :spark-icons:generateBaselineProfile :catalog:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true

      - name: 📤 Open PR with updated profiles
        env:
          GH_TOKEN: ${{ secrets.PAT_SPARK || secrets.GITHUB_TOKEN }}
          PAT: ${{ secrets.PAT_SPARK || secrets.GITHUB_TOKEN }}
        run: |
          git add '**/src/**/generated/baselineProfiles/*.txt'
          if git diff --cached --quiet --exit-code; then
            echo "::notice::Baseline profiles are up to date"
            exit 0
          fi
          branch="chore/update-baseline-profiles"
          git config user.name 'spark-ui-bot'
          git config user.email 'spark-ui-bot@users.noreply.github.com'
          git switch -C "$branch"
          git commit -m 'chore(baseline): regenerate baseline profiles'
          git remote set-url origin "https://x-access-token:${PAT}@github.com/${{ github.repository }}.git"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$branch" --base main \
              --title 'chore(baseline): regenerate baseline profiles' \
              --body 'Automated weekly regeneration of baseline profiles for `spark` and `catalog`.'
          fi
          echo "::notice::Baseline profiles updated"