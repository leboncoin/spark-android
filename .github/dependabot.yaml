# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
      - "/.github/workflows/*"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    registries: "*"
    labels: [ ]
    groups:
      android-build-tools:
        patterns:
          - com.android.tools:*
          - com.android.tools.build:*
          - com.android.tools.lint:*
          - com.android.application
          - com.android.library
          - com.android.lint
          - com.android.settings
          - com.android.test
      kotlin:
        patterns:
          - org.jetbrains.kotlin:*
          - org.jetbrains.kotlin.*
      compose:
        patterns:
          - androidx.compose*
          - org.jetbrains.compose*
    open-pull-requests-limit: 20
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
registries:
  maven-google:
    type: "maven-repository"
    url: "https://maven.google.com"
  gradle-plugins:
    type: "maven-repository"
    url: "https://plugins.gradle.org/m2/"
